name: Build & Release

# Every push to main that carries a new version in package.json builds the Mac
# app and publishes a GitHub Release (vX.Y.Z) with the DMG and the zip that the
# installed app downloads to update itself. Pushes that don't change the
# version only run the checks.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Version policy
        run: npm run version:check
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Is this a new version?
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v$VERSION is already released; nothing to publish."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  mac:
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build app
        run: npm run build
      - name: Package DMG + zip (Apple Silicon and Intel)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac --publish never
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          ls -la dist
          gh release create "v$VERSION" \
            dist/RackFlow-$VERSION-arm64.dmg dist/RackFlow-$VERSION-x64.dmg \
            dist/RackFlow-$VERSION-mac-arm64.zip dist/RackFlow-$VERSION-mac-x64.zip \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "RackFlow $VERSION" --generate-notes --latest
